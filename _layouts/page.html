---
layout: default
---
<div class="page-container">
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="page-meta">{{ page.subtitle }}</p>
    {% endif %}
  </header>
  <article class="markdown-content">
    {{ content }}
  </article>
</div>
